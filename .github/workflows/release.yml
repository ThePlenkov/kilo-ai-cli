name: Release

# One release at a time — concurrent dispatches would resolve the same
# next version and race on the tag/branch.
concurrency:
  group: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (x.y.z, or patch|minor|major vs npm latest)'
        required: false
        default: 'patch'
        type: string
      dry-run:
        description: 'Dry run (verify only — no tag, publish, or release)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# contents:write — push release tag + bump commit to main
# id-token:write — npm OIDC trusted publishing
permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          check-latest: true
          # OIDC trusted publishing — npm authenticates via the OIDC token
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build .nx-devkit submodule plugins
        working-directory: .nx-devkit
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      - name: Build
        run: npx nx run-many -t build

      - name: Typecheck
        run: npx nx run-many -t typecheck

      - name: Lint
        run: npx nx run-many -t lint

      - name: Test
        run: npx nx run-many -t test

      - name: Verify package contents
        working-directory: packages/cli
        run: npm pack

      - name: Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx nx run release:release \
            --version="${{ inputs.version }}" \
            --dryRun="${{ inputs.dry-run }}"

      # Tag-push path: create a GitHub Release with auto-generated changelog.
      - name: Create release (tag push)
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! gh release view "v$V" >/dev/null 2>&1; then
            gh release create "v$V" \
              --title "v$V" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
