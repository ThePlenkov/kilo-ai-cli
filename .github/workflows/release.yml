name: Release

# One release at a time — concurrent dispatches would resolve the same
# next version and race on the tag/branch.
concurrency:
  group: release

# Two phases, one file (npm OIDC trust binds to this filename):
#   workflow_dispatch → mode=bump  → cuts release/v<x.y.z> + opens a PR
#   push to main      → mode=publish → npm publish + tag + GitHub Release
# The version bump always lands via PR; automation never pushes to main.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump vs npm latest'
        required: false
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
      dry-run:
        description: 'Dry run (verify only — no branch or PR)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Default least-privilege; the release job escalates to what it needs.
permissions:
  contents: read

jobs:
  # Cheap pre-check for push events: package.json changes on every
  # dependabot merge, but only a version bump needs a release. Skips the
  # full gate suite when the committed version is already on npm + tagged.
  guard:
    name: Release needed?
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compare package.json version against npm + tags + release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          NPM="$(npm view kilo-ai-cli version 2>/dev/null || true)"
          # Distinguish "not published" from "registry unreachable" — a
          # transient npm outage should fail loudly, not burn the full
          # gate suite and die inside the publish path.
          if [ -z "$NPM" ] && ! npm ping >/dev/null 2>&1; then
            echo "npm registry unreachable — failing guard"
            exit 1
          fi
          if [ "$NPM" = "$VERSION" ] && \
             git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1 && \
             gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: guard
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.guard.outputs.needed == 'true') }}
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 10
    # contents:write — push release branch + tags
    # pull-requests:write — open the release PR (bump mode)
    # id-token:write — npm OIDC trusted publishing
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      # actions: write — approves the CI run of the bump PR this job creates
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          check-latest: true
          # OIDC trusted publishing — npm authenticates via the OIDC token
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build .nx-devkit submodule plugins
        working-directory: .nx-devkit
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      # npm run scripts are scoped to kilo-ai-cli (unscoped run-many would
      # execute targets on the .nx-devkit packages too, whose executors
      # aren't resolvable from the root install) and npm puts
      # node_modules/.bin on PATH without npx's registry fallback.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Verify package contents
        working-directory: packages/cli
        run: npm pack --dry-run

      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            ./node_modules/.bin/nx run release:release \
              --version="$INPUT_VERSION" \
              --mode=bump \
              --dryRun="$INPUT_DRY_RUN"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Manual tag escape hatch: the tag's checkout carries its own
            # package.json version, so publish mode needs no version arg —
            # but a non-semver v* tag must not publish anything.
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$VERSION" =~ ^[0-9] ]] || ! ./node_modules/.bin/semver "$VERSION" >/dev/null 2>&1; then
              echo "Ignoring non-semver tag: $GITHUB_REF_NAME"
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
            PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match packages/cli version $PKG_VERSION"
              exit 1
            fi
            ./node_modules/.bin/nx run release:release \
              --mode=publish \
              --dryRun=false
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
            ./node_modules/.bin/nx run release:release \
              --mode=publish \
              --dryRun=false
          fi

      # A publish that silently does nothing must not look like a green
      # release: `npm publish` can exit 0 without the version reaching the
      # registry. Verify the exact version instead of trusting the exit code.
      - name: Verify published version
        if: ${{ steps.release.outputs.published == 'true' }}
        working-directory: packages/cli
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ATTEMPTS=12
          for attempt in $(seq 1 $ATTEMPTS); do
            PUBLISHED="$(npm view "kilo-ai-cli@$VERSION" version 2>/dev/null || true)"
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "kilo-ai-cli@$VERSION is on the registry"
              exit 0
            fi
            echo "registry has '${PUBLISHED:-nothing}', expected $VERSION (attempt $attempt/$ATTEMPTS)"
            [ "$attempt" -lt "$ATTEMPTS" ] && sleep 15
          done
          echo "::error::kilo-ai-cli@$VERSION never reached the registry — the publish did not land"
          exit 1

      # The bump PR is created by this workflow with GITHUB_TOKEN. A workflow
      # run triggered by a bot-authored pull request waits for a maintainer
      # approval, so the required `check` never arrives and the PR cannot be
      # merged. Approve the run ourselves — the branch is one this workflow
      # created, and the code on it is the repository's own.
      - name: Approve the release PR's CI run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release/"))] | .[0].headRefName' 2>/dev/null || true)"
          if [ -z "$BRANCH" ]; then
            echo "::warning::No open release PR found — nothing to approve"
            exit 0
          fi
          echo "Approving the CI run for $BRANCH"
          for attempt in $(seq 1 12); do
            RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$BRANCH&event=pull_request" \
              --jq '[.workflow_runs[] | select(.conclusion == "action_required")] | .[0].id' 2>/dev/null || true)"
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/approve" \
                --jq '"approved run \(.id)"'
              exit 0
            fi
            echo "No run awaiting approval yet (attempt $attempt/12)"
            sleep 5
          done
          echo "::warning::No CI run awaiting approval for $BRANCH — approve it manually"
