name: Release

# One release at a time — concurrent dispatches would resolve the same
# next version and race on the tag/branch.
concurrency:
  group: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (x.y.z, or patch|minor|major vs npm latest)'
        required: false
        default: 'patch'
        type: string
      dry-run:
        description: 'Dry run (verify only — no tag, publish, or sync PR)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# contents:write — push release tag + bump commit to main
# id-token:write — npm OIDC trusted publishing
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          check-latest: true
          # OIDC trusted publishing — npm authenticates via the OIDC token
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build .nx-devkit submodule plugins
        working-directory: .nx-devkit
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      - name: Guard release to main
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run == 'false' }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          [ "$REF_NAME" = "main" ] || { echo "Releases must run from main"; exit 1; }

      - name: Compute next version
        id: ver
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="$INPUT_VERSION"
          case "$V" in
            patch|minor|major)
              BASE=$(npm view kilo-ai-cli version 2>/dev/null || echo 0.0.0)
              MAINV=$(node -p "require('./packages/cli/package.json').version")
              # npm ahead of main means a previous run published but never
              # synced — reuse THAT version instead of minting another release.
              if [ -n "$(npx --yes semver "$BASE" -r ">$MAINV" 2>/dev/null)" ]; then
                V="$BASE"
              else
                HI=$(printf '%s\n%s\n' "$BASE" "$MAINV" | sort -V | tail -n1)
                V=$(npx --yes semver "$HI" -i "$V")
              fi
              ;;
            *)
              echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' ||
                { echo "Invalid version: $V"; exit 1; }
              ;;
          esac
          echo "next=$V" >> "$GITHUB_OUTPUT"
          # Already on npm → skip publish but still repair tag/branch/PR
          # (self-heal after a partial run). Already published AND tagged →
          # check if the GitHub Release exists — if not, still proceed to
          # create it (release repair after a partial run).
          if npm view "kilo-ai-cli@$V" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
              if gh release view "v$V" >/dev/null 2>&1; then
                echo "kilo-ai-cli@$V is already published, tagged, and released — nothing to do"
                exit 1
              fi
              echo "tagged=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Tag pushes take the version from the tag; dispatches stamp the computed
      # version so the artifact always matches the released number.
      - name: Stamp package version
        working-directory: packages/cli
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ steps.ver.outputs.next }}"
          fi
          npm version "$V" --no-git-tag-version --allow-same-version

      # Commit the bump directly on main and tag it before building, so the tag
      # points at a commit whose package.json matches the published version.
      # Pushed only after publish succeeds — a failed run leaves no residue.
      - name: Commit bump and tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run == 'false' && steps.ver.outputs.tagged != 'true' }}
        run: |
          V="${{ steps.ver.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/cli/package.json package-lock.json
          # A rerun after a previous successful release has nothing to commit — that's fine.
          git diff --cached --quiet || git commit -m "chore: release $V"
          git rev-parse -q --verify "refs/tags/v$V" >/dev/null || git tag "v$V"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify package contents
        working-directory: packages/cli
        run: npm pack

      - name: Publish to npm (OIDC)
        if: ${{ github.event_name == 'push' || (inputs.dry-run == 'false' && steps.ver.outputs.published == 'false') }}
        working-directory: packages/cli
        run: npm publish --provenance --access public

      - name: Publish to npm (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run == 'true' }}
        working-directory: packages/cli
        run: npm publish --provenance --access public --dry-run

      # Push the bump commit directly to main + push the tag + create a GitHub
      # Release with auto-generated changelog. No PR — fully automated.
      # Rebase on origin/main first to avoid non-fast-forward failures when
      # main advances during the build/test/publish steps.
      - name: Push to main, tag, and create release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.next }}"
          # Skip main+tag push when already tagged (release repair — only
          # the GitHub Release is missing).
          if [ "${{ steps.ver.outputs.tagged }}" != "true" ]; then
            # Rebase the bump commit on the latest origin/main to avoid
            # non-fast-forward rejection if main advanced during the build.
            git fetch origin main
            git rebase origin/main
            # Idempotent: a rerun skips whatever already exists on the remote.
            git push origin main
            git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1 ||
              git push origin "v$V"
          fi
          # Create GitHub Release with auto-generated changelog (idempotent).
          if ! gh release view "v$V" >/dev/null 2>&1; then
            gh release create "v$V" \
              --title "v$V" \
              --generate-notes \
              --target main
          fi

      # Tag-push path: create a GitHub Release with auto-generated changelog.
      - name: Create release (tag push)
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! gh release view "v$V" >/dev/null 2>&1; then
            gh release create "v$V" \
              --title "v$V" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
