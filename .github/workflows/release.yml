name: Release

# One release at a time — concurrent dispatches would resolve the same
# next version and race on the tag/branch.
concurrency:
  group: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump vs npm latest'
        required: false
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
      dry-run:
        description: 'Dry run (verify only — no tag, publish, or release)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# contents:write — push release tag + bump commit to main
# id-token:write — npm OIDC trusted publishing
permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          check-latest: true
          # OIDC trusted publishing — npm authenticates via the OIDC token
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build .nx-devkit submodule plugins
        working-directory: .nx-devkit
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      # Scope to kilo-ai-cli: run-many without -p executes these targets on
      # every graph project, including the .nx-devkit packages whose build
      # executor (@nx-devkit/typescript:build) isn't resolvable as an npm
      # package from the root install.
      - name: Build
        run: ./node_modules/.bin/nx run-many -t build -p kilo-ai-cli

      - name: Typecheck
        run: ./node_modules/.bin/nx run-many -t typecheck -p kilo-ai-cli

      - name: Lint
        run: ./node_modules/.bin/nx run-many -t lint -p kilo-ai-cli

      - name: Test
        run: ./node_modules/.bin/nx run-many -t test -p kilo-ai-cli

      - name: Verify package contents
        working-directory: packages/cli
        run: npm pack

      - name: Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          ./node_modules/.bin/nx run release:release \
            --version="$INPUT_VERSION" \
            --dryRun="$INPUT_DRY_RUN"

      # Tag-push path: the tag name is the exact version. The executor is
      # idempotent — already-published/tagged/released steps are skipped, so
      # this also safely handles tags pushed by the dispatch path above.
      - name: Release (tag push)
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Gate on a leading digit first — a tag like v--help would be
          # parsed as a semver CLI option and pass validation.
          if [[ ! "$VERSION" =~ ^[0-9] ]] || ! ./node_modules/.bin/semver "$VERSION" >/dev/null 2>&1; then
            echo "Ignoring non-semver tag: $GITHUB_REF_NAME"
            exit 0
          fi
          ./node_modules/.bin/nx run release:release \
            --version="$VERSION" \
            --dryRun=false
