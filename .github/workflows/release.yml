name: Release

# One release at a time — concurrent dispatches would resolve the same
# next version and race on the tag/branch.
concurrency:
  group: release

# Two phases, one file (npm OIDC trust binds to this filename):
#   workflow_dispatch → mode=bump  → cuts release/v<x.y.z> + opens a PR
#   push to main      → mode=publish → npm publish + tag + GitHub Release
# The version bump always lands via PR; automation never pushes to main.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump vs npm latest'
        required: false
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
      dry-run:
        description: 'Dry run (verify only — no branch or PR)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Default least-privilege; the release job escalates to what it needs.
permissions:
  contents: read

jobs:
  # Cheap pre-check for push events: package.json changes on every
  # dependabot merge, but only a version bump needs a release. Skips the
  # full gate suite when the committed version is already on npm + tagged.
  guard:
    name: Release needed?
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compare package.json version against npm + tags + release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          # The tag and the GitHub Release are the authoritative evidence that
          # this version is out: both are created in the same run as the
          # publish. The registry is not — it replicates a fresh version over
          # minutes (the 0.4.8 publish was visible seven minutes after
          # `npm publish` returned), and a stale "not published" here would
          # send the release job into a second publish of a version that is
          # already out, which npm refuses.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1 && \
             gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            # A release is still needed when the tag or the GitHub Release is
            # missing — the executor skips the publish and finishes the rest.
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: guard
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.guard.outputs.needed == 'true') }}
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 30
    # contents:write — push release branch + tags
    # pull-requests:write — open the release PR (bump mode)
    # id-token:write — npm OIDC trusted publishing
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      # actions: write — approves the CI run of the bump PR this job creates
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          check-latest: true
          # OIDC trusted publishing — npm authenticates via the OIDC token
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts


      # npm run scripts are scoped to kilo-ai-cli and npm puts
      # node_modules/.bin on PATH without npx's registry fallback.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Verify package contents
        working-directory: packages/cli
        run: npm pack --dry-run

      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            ./node_modules/.bin/nx run release:release \
              --version="$INPUT_VERSION" \
              --mode=bump \
              --dryRun="$INPUT_DRY_RUN"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Manual tag escape hatch: the tag's checkout carries its own
            # package.json version, so publish mode needs no version arg —
            # but a non-semver v* tag must not publish anything.
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$VERSION" =~ ^[0-9] ]] || ! ./node_modules/.bin/semver "$VERSION" >/dev/null 2>&1; then
              echo "Ignoring non-semver tag: $GITHUB_REF_NAME"
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
            PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match packages/cli version $PKG_VERSION"
              exit 1
            fi
            ./node_modules/.bin/nx run release:release \
              --mode=publish \
              --dryRun=false
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
            ./node_modules/.bin/nx run release:release \
              --mode=publish \
              --dryRun=false
          fi

      # A publish that silently does nothing must not look like a green
      # release: `npm publish` can exit 0 without the version reaching the
      # registry. Verify the exact version instead of trusting the exit code.
      #
      # The wait is generous on purpose: the registry replicates a fresh
      # version over several minutes (the 0.4.8 publish was visible seven
      # minutes after `npm publish` returned), and a three-minute window
      # reported a successful release as failed.
      #
      # Sixteen attempts of forty-five seconds is twelve minutes of waiting
      # — comfortably past the observed lag. The curl timeout is ten seconds
      # so that a hanging registry cannot push the step past the job's
      # thirty-minute budget (the earlier steps need some of it too).
      - name: Verify published version
        if: ${{ steps.release.outputs.published == 'true' }}
        working-directory: packages/cli
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          MANIFEST="$(mktemp)"
          ATTEMPTS=16
          for attempt in $(seq 1 $ATTEMPTS); do
            # The version manifest, not the packument: the packument is
            # served with `max-age=300` and stays stale for minutes after a
            # publish, so `npm view <pkg>@<version>` and a plain
            # `npm view <pkg>` both report the version as missing. The
            # per-version document is created with the version, and the
            # cache-buster keeps a stale 404 from being served.
            STATUS="$(curl -s -o "$MANIFEST" -w '%{http_code}' --max-time 10 \
              "https://registry.npmjs.org/kilo-ai-cli/$VERSION?cb=$(date +%s%N)")" || STATUS="000"
            PUBLISHED=""
            if [ "$STATUS" = "200" ]; then
              PUBLISHED="$(jq -r '.version // ""' "$MANIFEST" 2>/dev/null || true)"
            fi
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "kilo-ai-cli@$VERSION is on the registry"
              exit 0
            fi
            if [ "$STATUS" = "404" ]; then
              echo "registry does not have $VERSION yet (attempt $attempt/$ATTEMPTS)"
            else
              echo "registry probe failed with HTTP $STATUS (attempt $attempt/$ATTEMPTS)"
            fi
            [ "$attempt" -lt "$ATTEMPTS" ] && sleep 45
          done
          echo "::error::kilo-ai-cli@$VERSION never reached the registry — the publish did not land"
          exit 1

      # The bump PR is created by this workflow with GITHUB_TOKEN. A workflow
      # run triggered by a bot-authored pull request waits for a maintainer
      # approval, so the required `check` never arrives and the PR cannot be
      # merged. Approve the run ourselves — the branch is one this workflow
      # created, and the code on it is the repository's own.
      - name: Approve the release PR's CI run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Match the run by the PR's head commit — a branch can carry an
          # older run that is still awaiting approval, and approving that one
          # would leave the current PR without a `check`.
          # The newest open release PR is the one this job just created —
          # an older one must not be picked up when several are open.
          read -r BRANCH SHA <<< "$(gh pr list --state open --json headRefName,headRefOid,createdAt \
            --jq '[.[] | select(.headRefName | startswith("release/"))] | max_by(.createdAt) | "\(.headRefName) \(.headRefOid)"' 2>/dev/null || true)"
          if [ -z "$BRANCH" ] || [ -z "$SHA" ]; then
            echo "::warning::No open release PR found — nothing to approve"
            exit 0
          fi
          echo "Approving the CI run for $BRANCH ($SHA)"
          for attempt in $(seq 1 12); do
            RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$BRANCH&event=pull_request" \
              --jq "[.workflow_runs[] | select(.head_sha == \"$SHA\" and .conclusion == \"action_required\")] | .[0].id" 2>/dev/null || true)"
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/approve" > /dev/null
              echo "approved run $RUN_ID"
              exit 0
            fi
            echo "No run awaiting approval yet (attempt $attempt/12)"
            sleep 5
          done
          # The bump PR exists, so a CI run for it must exist too. Exiting
          # successfully here would leave the PR blocked on the required
          # `check` with nothing pointing at the problem.
          echo "::error::No CI run awaiting approval for $BRANCH — approve it manually"
          exit 1
