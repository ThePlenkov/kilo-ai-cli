name: Release

# One release at a time — concurrent dispatches would resolve the same
# next version and race on the tag/branch.
concurrency:
  group: release

# Two phases, one file (npm OIDC trust binds to this filename):
#   workflow_dispatch → mode=bump  → cuts release/v<x.y.z> + opens a PR
#   push to main      → mode=publish → npm publish + tag + GitHub Release
# The version bump always lands via PR; automation never pushes to main.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump vs npm latest'
        required: false
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
      dry-run:
        description: 'Dry run (verify only — no tag, publish, or release)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# contents:write — push release branch + tags
# pull-requests:write — open the release PR (bump mode)
# id-token:write — npm OIDC trusted publishing
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # Cheap pre-check for push events: package.json changes on every
  # dependabot merge, but only a version bump needs a release. Skips the
  # full gate suite when the committed version is already on npm + tagged.
  guard:
    name: Release needed?
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compare package.json version against npm + tags
        id: check
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          NPM="$(npm view kilo-ai-cli version 2>/dev/null || true)"
          if [ "$NPM" = "$VERSION" ] && \
             git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: guard
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.guard.outputs.needed == 'true') }}
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          check-latest: true
          # OIDC trusted publishing — npm authenticates via the OIDC token
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build .nx-devkit submodule plugins
        working-directory: .nx-devkit
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      # npm run scripts are scoped to kilo-ai-cli (unscoped run-many would
      # execute targets on the .nx-devkit packages too, whose executors
      # aren't resolvable from the root install) and npm puts
      # node_modules/.bin on PATH without npx's registry fallback.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Verify package contents
        working-directory: packages/cli
        run: npm pack

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ./node_modules/.bin/nx run release:release \
              --version="$INPUT_VERSION" \
              --mode=bump \
              --dryRun="$INPUT_DRY_RUN"
          else
            ./node_modules/.bin/nx run release:release \
              --mode=publish \
              --dryRun=false
          fi
