name: Diagnostic publish

# Temporary: reproduce the silent npm publish failure with the output visible.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diag:
    name: Diagnose
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build .nx-devkit submodule plugins
        working-directory: .nx-devkit
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      - name: Build
        run: npm run build

      - name: Show environment
        run: |
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "head=$(git rev-parse HEAD)"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)"
          echo "remote=$(git config --get remote.origin.url)"
          echo "version=$(node -p "require('./packages/cli/package.json').version")"
          echo "npm=$(npm --version) node=$(node --version)"

      - name: npm view (what the executor checks)
        working-directory: packages/cli
        run: |
          echo "--- npm view kilo-ai-cli@0.4.6 version ---"
          npm view "kilo-ai-cli@0.4.6" version; echo "exit=$?"

      - name: npm publish (output visible)
        working-directory: packages/cli
        run: |
          set -x
          npm publish --access public --provenance --registry https://registry.npmjs.org/ 2>&1
          echo "publish exit=$?"
