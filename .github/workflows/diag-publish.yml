name: Diagnostic publish

# Temporary: reproduce the silent npm publish failure with the output visible.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: Diagnose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build .nx-devkit submodule plugins
        working-directory: .nx-devkit
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      - name: Build
        run: npm run build

      - name: Show environment
        run: |
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "head=$(git rev-parse HEAD)"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)"
          echo "remote=$(git config --get remote.origin.url)"
          echo "version=$(node -p "require('./packages/cli/package.json').version")"
          echo "npm=$(npm --version) node=$(node --version)"

      - name: npm view (what the executor checks)
        working-directory: packages/cli
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "--- npm view kilo-ai-cli@$VERSION version ---"
          npm view "kilo-ai-cli@$VERSION" version || echo "view failed with $?"

      # The exact probe the release workflow uses to decide whether the
      # publish landed — exercised in both directions.
      - name: Verification probe
        working-directory: packages/cli
        run: |
          MANIFEST="$(mktemp)"
          probe() {
            VERSION="$1"
            STATUS="$(curl -s -o "$MANIFEST" -w '%{http_code}' --max-time 20 \
              "https://registry.npmjs.org/kilo-ai-cli/$VERSION?cb=$(date +%s%N)" || echo 000)"
            PUBLISHED=""
            if [ "$STATUS" = "200" ]; then
              PUBLISHED="$(jq -r '.version // ""' "$MANIFEST" 2>/dev/null || true)"
            fi
            echo "version=$VERSION status=$STATUS published='${PUBLISHED:-nothing}'"
            PROBE_STATUS="$STATUS"
            PROBE_PUBLISHED="$PUBLISHED"
          }
          # A version that is on the registry, and one that is not. The
          # positive case is pinned to a published version — the version in
          # package.json moves with every release and would be missing here.
          probe "0.4.6"
          POSITIVE_STATUS="$PROBE_STATUS"
          POSITIVE_PUBLISHED="$PROBE_PUBLISHED"
          probe "0.0.0-not-a-version"
          NEGATIVE_STATUS="$PROBE_STATUS"
          NEGATIVE_PUBLISHED="$PROBE_PUBLISHED"

          FAILED=0
          if [ "$POSITIVE_STATUS" != "200" ] || [ "$POSITIVE_PUBLISHED" != "0.4.6" ]; then
            echo "::error::the published version was not found (status=$POSITIVE_STATUS published=$POSITIVE_PUBLISHED)"
            FAILED=1
          fi
          if [ "$NEGATIVE_STATUS" != "404" ] || [ -n "$NEGATIVE_PUBLISHED" ]; then
            echo "::error::the missing version was reported as published (status=$NEGATIVE_STATUS published=$NEGATIVE_PUBLISHED)"
            FAILED=1
          fi
          exit "$FAILED"
