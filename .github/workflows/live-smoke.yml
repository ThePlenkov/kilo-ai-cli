name: Live Smoke

# Scheduled contract regression check against the real api.kilo.ai, plus an
# on-demand run (optionally covering side-effecting `manual` commands).
#
# Requires the `KILO_CREDENTIALS_JSON` secret — the contents of
# ~/.kilo/credentials.json from a dedicated test account (e.g.
# {"type":"api","key":"..."} or a device-auth {"type":"oauth",...} blob).

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      include-manual:
        description: 'Also run manual (side-effecting) commands — use only on a test account'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    # The job touches KILO_CREDENTIALS_JSON — the `live-smoke` environment
    # should be restricted to `main` (and optionally require approval) in the
    # repo settings so a dispatched run on a branch cannot read the secret.
    environment: live-smoke
    # The schedule runs read+idempotent commands only; manual commands need an
    # explicit dispatch opt-in.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          check-latest: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: npm ci --ignore-scripts
      - name: Build .nx-devkit submodule plugins
        working-directory: .nx-devkit
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
      - run: npx nx build kilo-ai-cli
      - name: Guard credentials to main
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          [ "$REF_NAME" = "main" ] || {
            echo "live-smoke runs on main only — secrets are not exposed to branch runs."
            exit 1
          }
      - name: Install test-account credentials
        env:
          KILO_CREDENTIALS_JSON: ${{ secrets.KILO_CREDENTIALS_JSON }}
        run: |
          mkdir -p ~/.kilo
          printf '%s' "$KILO_CREDENTIALS_JSON" > ~/.kilo/credentials.json
          chmod 600 ~/.kilo/credentials.json
      - name: Run live smoke
        working-directory: packages/cli
        run: node scripts/live-smoke.ts ${{ inputs.include-manual && '--include-manual' || '' }} --out "$RUNNER_TEMP/LIVE-MATRIX.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-matrix-${{ github.run_id }}
          path: ${{ runner.temp }}/LIVE-MATRIX.md
          if-no-files-found: warn
