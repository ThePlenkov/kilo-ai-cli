name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          check-latest: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: npm ci --ignore-scripts
      - name: Build .nx-devkit submodule plugins
        working-directory: .nx-devkit
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Docs lint
        run: npx --yes markdownlint-cli2@0.24.0 "README.md" "AGENTS.md" "SECURITY.md" "docs/**/*.md" "packages/*/README.md" ".devin/**/*.md"
      - run: npm run test
      - run: npm run build
      - name: Pack (dry run)
        run: npm pack --dry-run --workspace kilo-ai-cli
      - name: Smoke (the CLI from source)
        run: |
          npx tsx packages/cli/src/index.ts --help > /dev/null
          npx tsx packages/cli/src/index.ts cursor list > /dev/null
      - name: Dependency audit
        run: npm audit --audit-level=high
