name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          check-latest: true
      - uses: oven-sh/setup-bun@v2
      - run: npm ci --ignore-scripts
      - name: Build .nx-devkit submodule plugins
        working-directory: .nx-devkit
        run: |
          bun install --frozen-lockfile
          bun run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
