name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          check-latest: true
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Docs lint
        run: npx --ignore-scripts --yes markdownlint-cli2@0.24.0 "README.md" "AGENTS.md" "SECURITY.md" "docs/**/*.md" "packages/*/README.md" ".devin/**/*.md"
      - name: Lint report (SARIF)
        working-directory: packages/cli
        run: ../../node_modules/.bin/oxlint --format=sarif > eslint.sarif || true
      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eslint-sarif
          path: packages/cli/eslint.sarif
          if-no-files-found: ignore
      - run: npm run test
      - run: npm run build
      - name: Pack (dry run)
        run: npm pack --dry-run --workspace kilo-ai-cli
      - name: Smoke (the CLI from source)
        run: |
          ./node_modules/.bin/tsx packages/cli/src/index.ts --help > /dev/null
          ./node_modules/.bin/tsx packages/cli/src/index.ts cursor list > /dev/null
      - name: Dependency audit
        run: npm audit --audit-level=high
